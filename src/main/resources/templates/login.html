<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SprinVoices</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="login-container">

    <div class="card">

        <!-- Logo -->
        <div class="logo">
            <h1>SprinVoices</h1>
            <p>Module de facturation</p>
        </div>

        <!-- Messages -->
        <div th:if="${param.error}" class="alert alert-error">
            Identifiants incorrects. Veuillez réessayer.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez été déconnecté avec succès.
        </div>
        <div th:if="${param.resetSuccess}" class="alert alert-success">
    Mot de passe modifié avec succès. Vous pouvez vous connecter.
</div>

        <!-- Form -->
        <form method="post" th:action="@{/login}">

            <div class="form-group">
                <label for="username">Email / Identifiant</label>
                <input type="text" id="username" name="username"
                       placeholder="ex: admin@company.com" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required/>
            </div>

            <button type="submit">Se connecter</button>
            <!-- reset password link -->
            <div style="text-align:center;margin-top:12px;font-size:13px;">
            <a th:href="@{/forgot-password}" style="color:#C0392B;text-decoration:none;">
                Mot de passe oublié ?
            </a>
        </div>
        </form>

        <div class="footer">
            © SprinVoices — Tous droits réservés
        </div>

    </div>

</div>

</body>
</html>
