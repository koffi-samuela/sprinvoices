<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 24px;
            color: #C0392B;
            font-weight: bold;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #C0392B;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #C0392B;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover { background: #a93226; }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .alert-error {
            background: #fdecea;
            color: #C0392B;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #a9dfbf;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>SprinVoices</h1>
        <p>Module de facturation</p>
    </div>

    <!-- Message d'erreur si mauvais identifiants -->
    <div th:if="${param.error}" class="alert alert-error">
        Identifiants incorrects. Veuillez réessayer.
    </div>

    <!-- Message de succès après déconnexion -->
    <div th:if="${param.logout}" class="alert alert-success">
        Vous avez été déconnecté avec succès.
    </div>

    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username"
                   placeholder="Votre identifiant" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   placeholder="Votre mot de passe" required/>
        </div>
        <button type="submit">Se connecter</button>
    </form>
</div>
</body>
</html>
