<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SprinVoices</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.434);
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 26px;
            color: #C0392B;
            margin-bottom: 4px;
        }

        .logo p {
            color: #7f8c8d;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #C0392B;
            outline: none;
            box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #C0392B;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #a93226;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .alert-error {
            background: #fdecea;
            color: #C0392B;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #a9dfbf;
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="card">

        <!-- Logo -->
        <div class="logo">
            <h1>SprinVoices</h1>
            <p>Module de facturation</p>
        </div>

        <!-- Messages -->
        <div th:if="${param.error}" class="alert alert-error">
            Identifiants incorrects. Veuillez réessayer.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez été déconnecté avec succès.
        </div>
        <div th:if="${param.resetSuccess}" class="alert alert-success">
    Mot de passe modifié avec succès. Vous pouvez vous connecter.
</div>

        <!-- Form -->
        <form method="post" th:action="@{/login}">

            <div class="form-group">
                <label for="username">Email / Identifiant</label>
                <input type="text" id="username" name="username"
                       placeholder="ex: admin@company.com" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required/>
            </div>

            <button type="submit">Se connecter</button>
            <!-- reset password link -->
            <div style="text-align:center;margin-top:12px;font-size:13px;">
            <a th:href="@{/forgot-password}" style="color:#C0392B;text-decoration:none;">
                Mot de passe oublié ?
            </a>
        </div>
        </form>

        <div class="footer">
            © SprinVoices — Tous droits réservés
        </div>

    </div>

</div>

</body>
</html>
