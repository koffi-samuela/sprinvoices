<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar :: head('Devis')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('quotes')}"></div>

<div class="main-content" id="mainContent">

    <div class="topbar">
        <span class="topbar-title">Devis</span>
        <div class="topbar-actions">
            <a th:href="@{/admin/quotes/new}" class="sv-btn sv-btn-primary">
                <i class="bi bi-plus-lg"></i> Nouveau devis
            </a>
        </div>
    </div>

    <div class="page-content">

        <div class="sv-table-card">
            <table class="table sv-table mb-0">
                <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Désignation</th>
                    <th>Client</th>
                    <th>Date</th>
                    <th>État</th>
                    <th>Total HT</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="q : ${quotes}">
                    <td>
                        <span class="sv-invoice-number" th:text="${q.number}"></span>
                    </td>

                    <td th:text="${q.designation}"></td>
                    <td th:text="${q.customer.name}"></td>

                    <td class="text-muted"
                        th:text="${#temporals.format(q.createdAt, 'dd/MM/yyyy à HH:mm')}"></td>

                    <td>
                        <span th:if="${q.status == 'DRAFT'}" class="sv-badge sv-badge-created">Brouillon</span>
                        <span th:if="${q.status == 'SENT'}" class="sv-badge sv-badge-invoiced">Envoyé</span>
                        <span th:if="${q.status == 'ACCEPTED'}" class="sv-badge sv-badge-paid">Accepté</span>
                        <span th:if="${q.status == 'REFUSED'}" class="sv-badge sv-badge-danger">Refusé</span>
                    </td>

                    <td class="sv-amount"
                        th:text="${#numbers.formatDecimal(q.total(), 1, 2)} + ' €'"></td>

                    <td>
                        <div class="sv-actions">
                            <a th:href="@{/admin/quotes/{id}(id=${q.id})}"
                               class="sv-btn-icon" title="Voir">
                                <i class="bi bi-eye"></i>
                            </a>

                            <form th:action="@{/admin/quotes/delete/{id}(id=${q.id})}"
                                  method="post"
                                  onsubmit="return confirm('Supprimer ce devis ?')">
                                <button class="sv-btn-icon sv-btn-icon-danger" type="submit" title="suppimer">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(quotes)}">
                    <td colspan="7" class="sv-empty">Aucun devis enregistré.</td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
