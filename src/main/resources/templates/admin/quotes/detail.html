<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar :: head('Devis')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('quotes')}"></div>

<div class="main-content" id="mainContent">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/quotes}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title"
                  th:text="${quote.number} + ' — ' + ${quote.designation}">
            </span>
        </div>
    </div>

    <div class="page-content">

        <!-- HEADER CARD -->
        <div class="sv-form-card mb-4">

            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <div class="sv-form-section-title mb-1">
                        <i class="bi bi-file-earmark-text"></i>
                        <span th:text="${quote.number}"></span>
                    </div>
                    <div class="text-muted">
                        Créé le <span th:text="${#temporals.format(quote.createdAt, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <!-- STATUS -->
                <div>
                    <span th:if="${quote.status == 'DRAFT'}"
                          class="sv-badge sv-badge-created">Brouillon</span>

                    <span th:if="${quote.status == 'SENT'}"
                          class="sv-badge sv-badge-invoiced">Envoyé</span>

                    <span th:if="${quote.status == 'ACCEPTED'}"
                          class="sv-badge sv-badge-paid">Accepté</span>

                    <span th:if="${quote.status == 'REFUSED'}"
                          class="sv-badge sv-badge-danger">Refusé</span>
                </div>
            </div>

            <!-- INFOS -->
            <div class="row g-3">

                <!-- CLIENT -->
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Client</div>
                        <div class="fw-500" th:text="${quote.customer.name}"></div>
                        <div class="text-muted" th:text="${quote.customer.corporateName}"></div>
                        <div class="text-muted" th:text="${quote.customer.address}"></div>
                        <div class="text-muted"
                             th:text="${quote.customer.zipcode} + ' ' + ${quote.customer.city}"></div>
                    </div>
                </div>

                <!-- DATES -->
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Dates</div>

                        <div>
                            Créé le :
                            <span th:text="${#temporals.format(quote.createdAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${quote.sentAt != null}">
                            Envoyé le :
                            <span th:text="${#temporals.format(quote.sentAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${quote.sentAt == null}" class="text-muted">
                            Envoyé : —
                        </div>
                    </div>
                </div>

            </div>

            <!-- ACTIONS -->
            <div class="sv-form-actions mt-4">

                <form th:if="${quote.status == 'DRAFT'}"
                      th:action="@{/admin/quotes/{id}/send(id=${quote.id})}" method="post">
                    <button class="sv-btn sv-btn-secondary">
                        <i class="bi bi-send"></i> Envoyer
                    </button>
                </form>

                <form th:if="${quote.status == 'SENT'}"
                      th:action="@{/admin/quotes/{id}/accept(id=${quote.id})}" method="post">
                    <button class="sv-btn sv-btn-primary">
                        <i class="bi bi-check-lg"></i> Accepter
                    </button>
                </form>

                <form th:if="${quote.status == 'SENT'}"
                      th:action="@{/admin/quotes/{id}/refuse(id=${quote.id})}" method="post">
                    <button class="sv-btn sv-btn-danger">
                        <i class="bi bi-x-lg"></i> Refuser
                    </button>
                </form>

                <form th:if="${quote.status == 'ACCEPTED'}"
                      th:action="@{/admin/quotes/{id}/convert(id=${quote.id})}" method="post"
                      onsubmit="return confirm('Convertir ce devis en facture ?')">
                    <button class="sv-btn sv-btn-primary">
                        <i class="bi bi-receipt"></i> Convertir en facture
                    </button>
                </form>

            </div>

        </div>

        <!-- TABLE -->
        <div class="sv-table-card">

            <table class="table sv-table mb-0">
                <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Catégorie</th>
                        <th>Prix HT</th>
                        <th>Qté</th>
                        <th>Montant</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="row : ${quote.rows}">
                        <td class="fw-500" th:text="${row.product.designation}"></td>

                        <td>
                            <span class="sv-badge sv-badge-created"
                                  th:text="${row.product.category}"></span>
                        </td>

                        <td th:text="${#numbers.formatDecimal(row.product.unitPrice,1,2)} + ' €'"></td>

                        <td th:text="${row.quantity}"></td>

                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(row.amount(),1,2)} + ' €'"></td>

                        <td>
                            <form th:if="${quote.status == 'DRAFT'}"
                                  th:action="@{/admin/quotes/{id}/delete-row/{rowId}(id=${quote.id},rowId=${row.id})}"
                                  method="post"
                                  onsubmit="return confirm('Supprimer cette ligne ?')">

                                <button class="sv-btn-icon sv-btn-icon-danger" title="supprimer">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(quote.rows)}">
                        <td colspan="6" class="sv-empty">
                            Aucun produit ajouté.
                        </td>
                    </tr>

                    <!-- TOTAL -->
                    <tr>
                        <td colspan="4" class="text-end fw-500">TOTAL HT</td>
                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(quote.total(),1,2)} + ' €'"></td>
                        <td></td>
                    </tr>

                </tbody>
            </table>

        </div>

        <!-- ADD ROW -->
        <div class="sv-form-card mt-4" th:if="${quote.status == 'DRAFT'}">

            <div class="sv-form-section-title mb-3">
                <i class="bi bi-plus-circle"></i> Ajouter une ligne
            </div>

            <form th:action="@{/admin/quotes/{id}/add-row(id=${quote.id})}"
                  method="post"
                  class="row g-3 align-items-end">

                <div class="col-md-6">
                    <label>Produit</label>
                    <select name="productId" class="sv-select" required title="product">
                        <option value="">-- Choisir --</option>
                        <option th:each="p : ${products}"
                                th:value="${p.id}"
                                th:text="${p.designation} + ' (' + ${p.unitPrice} + ' €)'">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Quantité</label>
                    <input type="number" name="quantity"
                           step="0.5" min="0.5"
                           placeholder="0"
                           class="sv-input" required>
                </div>

                <div class="col-md-3">
                    <button class="sv-btn sv-btn-primary w-100">
                        Ajouter
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

</body>
</html>
