<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar :: head('Nouveau devis')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('quotes')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <span class="topbar-title">Nouveau devis</span>
        <div class="topbar-actions">
            <a th:href="@{/admin/quotes}" class="btn btn-secondary btn-sm">← Retour</a>
        </div>
    </div>
    <div class="page-content">
        <div class="card" style="max-width:600px;">
            <form th:action="@{/admin/quotes/new}" method="post">
                <div class="form-group">
                    <label>Désignation *</label>
                    <input type="text" name="designation" placeholder="Ex: Devis développement site web" required/>
                </div>
                <div class="form-group">
                    <label>Client *</label>
                    <select name="customerId" required title="customer">
                        <option value="">-- Sélectionner un client --</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name} + ' — ' + ${c.corporateName}">
                        </option>
                    </select>
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">Créer le devis</button>
                    <a th:href="@{/admin/quotes}" class="btn btn-secondary" style="margin-left:10px;">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
