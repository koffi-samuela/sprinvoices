<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/sidebar :: head('Nouvelle facture')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/invoices}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title">Nouvelle facture</span>
        </div>
    </div>

    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="sv-form-card">
                    <div class="sv-form-card-title mb-4">Informations de la facture</div>

                    <form th:action="@{/admin/invoices/new}"
                          th:object="${invoice}"
                          method="post">

                        <div class="sv-form-group">
                            <label>Désignation <span class="sv-required">*</span></label>
                            <input type="text"
                                   th:field="*{designation}"
                                   placeholder="Ex : Facture Janvier 2026"
                                   class="sv-input"
                                   required>
                        </div>

                        <div class="sv-form-group">
                            <label>Client <span class="sv-required">*</span></label>
                            <select name="customerId" class="sv-select" required title="customer">
                                <option value="">-- Sélectionner un client --</option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.name} + ' — ' + ${c.corporateName}">
                                </option>
                            </select>
                        </div>

                        <div class="sv-form-actions mt-4">
                            <button type="submit" class="sv-btn sv-btn-primary">
                                <i class="bi bi-check-lg"></i> Créer la facture
                            </button>
                            <a th:href="@{/admin/invoices}" class="sv-btn sv-btn-ghost">
                                Annuler
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
