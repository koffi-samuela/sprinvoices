<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar :: head('Factures')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <span class="topbar-title">Gestion des factures</span>
        <div class="topbar-actions">
            <a th:href="@{/admin/invoices/new}" class="btn btn-primary">+ Nouvelle facture</a>
        </div>
    </div>
    <div class="page-content">

        <!-- Barre de filtres -->
        <form th:action="@{/admin/invoices}" method="get" class="filter-bar">
            <div class="form-group">
                <label>Client</label>
                <select name="customerId" title="customer">
                    <option value="">Tous les clients</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.id}"
                            th:text="${c.name}"
                            th:selected="${selectedCustomer == c.id}">
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label>État</label>
                <select name="status" title="status" class="form-select">
                    <option value="">Tous les états</option>
                    <option value="CREATED"  th:selected="${selectedStatus == 'CREATED'}">Créée</option>
                    <option value="INVOICED" th:selected="${selectedStatus == 'INVOICED'}">Facturée</option>
                    <option value="PAID"     th:selected="${selectedStatus == 'PAID'}">Payée</option>
                </select>
            </div>
            <div class="form-group" style="flex:0">
                <label>&nbsp;</label>
                <button type="submit" class="btn btn-info">Filtrer</button>
            </div>
            <div class="form-group" style="flex:0">
                <label>&nbsp;</label>
                <a th:href="@{/admin/invoices}" class="btn btn-secondary">Réinitialiser</a>
            </div>
        </form>

        <!-- Tableau -->
        <div class="sv-table-card">
            <table class="table sv-table mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Désignation</th>
                        <th>Client</th>
                        <th>Date</th>
                        <th>État</th>
                        <th>Total HT</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inv : ${invoices}">
                        <td>
    <span style="font-weight:600; color:#C0392B;"
          th:text="${inv.number}">FAC-2026-001</span>
</td>
                        <td th:text="${inv.designation}"></td>
                        <td th:text="${inv.customer.name}"></td>
                        <td th:text="${#temporals.format(inv.createdAt, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:if="${inv.paidAt != null}" class="sv-badge sv-badge-paid">Payée</span>
                            <span th:if="${inv.paidAt == null and inv.invoicedAt != null}"
                                  class="sv-badge sv-badge-invoiced">Facturée</span>
                            <span th:if="${inv.invoicedAt == null}"
                                  class="sv-badge sv-badge-created">Créée</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(inv.total(), 1, 2)} + ' €'"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/admin/invoices/{id}(id=${inv.id})}" class="btn btn-info btn-sm">Détail</a>
                                <form th:action="@{/admin/invoices/delete/{id}(id=${inv.id})}" method="post"
                                      onsubmit="return confirm('Supprimer cette facture ?')">
                                    <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(invoices)}">
                        <td colspan="7" class="empty-state">Aucune facture trouvée.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
