<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/sidebar :: head('Facture')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('invoices')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/invoices}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title" th:text="${invoice.number}"></span>
            <span th:if="${invoice.paidAt != null}"
                  class="sv-badge sv-badge-paid">Payée</span>
            <span th:if="${invoice.paidAt == null and invoice.invoicedAt != null}"
                  class="sv-badge sv-badge-invoiced">Facturée</span>
            <span th:if="${invoice.invoicedAt == null}"
                  class="sv-badge sv-badge-created">Créée</span>
        </div>
        <div class="topbar-actions">
            <a th:href="@{/admin/invoices/{id}/pdf(id=${invoice.id})}"
               target="_blank" class="sv-btn sv-btn-ghost">
                <i class="bi bi-eye"></i> Aperçu PDF
            </a>
            <a th:href="@{/admin/invoices/{id}/pdf/download(id=${invoice.id})}"
               class="sv-btn sv-btn-secondary">
                <i class="bi bi-download"></i> Télécharger
            </a>
            <form th:action="@{/admin/invoices/{id}/send-email(id=${invoice.id})}"
          method="post" style="display:inline;">
        <button type="submit" class="sv-btn sv-btn-primary">
            <i class="bi bi-envelope"></i> Envoyer au client
        </button>
    </form>
        </div>
    </div>

    <div class="page-content">
        <div th:if="${successMessage}" class="alert alert-success"
     style="margin-bottom:16px;">
    <i class="bi bi-check-circle"></i>
    <span th:text="${successMessage}"></span>
</div>
        <!-- Infos générales -->
        <div class="sv-detail-card mb-4">
            <div class="sv-detail-header">
                <div>
                    <div class="sv-detail-title" th:text="${invoice.designation}"></div>
                    <div class="sv-detail-meta"
                         th:text="'Créée le ' + ${#temporals.format(invoice.createdAt, 'dd/MM/yyyy à HH:mm')}"></div>
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Client</div>
                        <div class="sv-info-value" th:text="${invoice.customer.name}"></div>
                        <div class="sv-info-sub" th:text="${invoice.customer.corporateName}"></div>
                        <div class="sv-info-sub" th:text="${invoice.customer.address}"></div>
                        <div class="sv-info-sub"
                             th:text="${invoice.customer.zipcode} + ' ' + ${invoice.customer.city}"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Dates</div>
                        <div class="sv-info-row">
                            <span>Créée</span>
                            <span th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy')}"></span>
                        </div>
                        <div class="sv-info-row">
                            <span>Facturée</span>
                            <span th:if="${invoice.invoicedAt != null}"
                                  th:text="${#temporals.format(invoice.invoicedAt, 'dd/MM/yyyy')}"></span>
                            <span th:if="${invoice.invoicedAt == null}" class="text-muted">—</span>
                        </div>
                        <div class="sv-info-row">
                            <span>Payée</span>
                            <span th:if="${invoice.paidAt != null}"
                                  th:text="${#temporals.format(invoice.paidAt, 'dd/MM/yyyy')}"></span>
                            <span th:if="${invoice.paidAt == null}" class="text-muted">—</span>
                        </div>
                        <div class="sv-info-row">
                            <span>Délai paiement</span>
                            <span th:text="${invoice.customer.delay} + ' jours'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lignes de facture -->
        <div class="sv-detail-card mb-4">
            <div class="sv-detail-section-title mb-3">Lignes de facture</div>

            <div class="sv-table-card">
                <table class="table sv-table mb-0">
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Catégorie</th>
                            <th>Prix unitaire HT</th>
                            <th>Qté</th>
                            <th>Montant HT</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${invoice.rows}">
                            <td th:text="${row.product.designation}"></td>
                            <td>
                                <span class="sv-badge sv-badge-category"
                                      th:text="${row.product.category}"></span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(row.product.unitPrice, 1, 2)} + ' €'"></td>
                            <td th:text="${row.quantity}"></td>
                            <td class="sv-amount"
                                th:text="${#numbers.formatDecimal(row.amount(), 1, 2)} + ' €'"></td>
                            <td>
                                <form th:action="@{/admin/invoices/{id}/delete-row/{rowId}(id=${invoice.id},rowId=${row.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="sv-btn-icon sv-btn-icon-danger"
                                            onclick="return confirm('Supprimer cette ligne ?')"
                                            title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(invoice.rows)}">
                            <td colspan="6" class="sv-empty">
                                Aucune ligne. Ajoutez des produits ci-dessous.
                            </td>
                        </tr>
                        <tr class="sv-total-row">
                            <td colspan="4">Total HT</td>
                            <td class="sv-amount"
                                th:text="${#numbers.formatDecimal(invoice.total(), 1, 2)} + ' €'"></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Ajouter une ligne -->
            <div class="sv-add-row mt-4">
                <div class="sv-detail-section-title mb-3">Ajouter une ligne</div>
                <form th:action="@{/admin/invoices/{id}/add-row(id=${invoice.id})}"
                      method="post"
                      class="d-flex gap-3 align-items-end">
                    <div class="sv-filter-group" style="flex:2">
                        <label>Produit</label>
                        <select name="productId" required class="sv-select" title="product">
                            <option value="">-- Sélectionner un produit --</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.id}"
                                    th:text="${p.designation} + ' — ' + ${p.unitPrice} + ' €'">
                            </option>
                        </select>
                    </div>
                    <div class="sv-filter-group" style="flex:1">
                        <label>Quantité</label>
                        <input type="number" name="quantity" step="0.5" min="0.5"
                               placeholder="1" required class="sv-input">
                    </div>
                    <div>
                        <button type="submit" class="sv-btn sv-btn-primary">
                            <i class="bi bi-plus-lg"></i> Ajouter
                        </button>
                    </div>
                </form>
            </div>

            <!-- Actions statut -->
            <div class="sv-status-actions mt-4" th:if="${invoice.invoicedAt == null or invoice.paidAt == null}">
                <div class="sv-detail-section-title mb-3">Changer le statut</div>
                <div class="d-flex gap-2">
                    <form th:if="${invoice.invoicedAt == null}"
                          th:action="@{/admin/invoices/{id}/mark-invoiced(id=${invoice.id})}"
                          method="post">
                        <button type="submit" class="sv-btn sv-btn-warning">
                            <i class="bi bi-send"></i> Marquer comme Facturée
                        </button>
                    </form>
                    <form th:if="${invoice.invoicedAt != null and invoice.paidAt == null}"
                          th:action="@{/admin/invoices/{id}/mark-paid(id=${invoice.id})}"
                          method="post">
                        <button type="submit" class="sv-btn sv-btn-success">
                            <i class="bi bi-patch-check"></i> Marquer comme Payée
                        </button>
                    </form>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
