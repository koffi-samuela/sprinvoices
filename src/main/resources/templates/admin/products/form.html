<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/sidebar :: head('Produit')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

<div class="main-content" id="mainContent">

    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/products}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title"
                  th:text="${product.id == null ? 'Nouveau produit' : 'Modifier le produit'}">
            </span>
        </div>
    </div>

    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="sv-form-card">

                    <form th:action="${product.id == null ? '/admin/products/new' : '/admin/products/edit/' + product.id}"
                          th:object="${product}"
                          method="post">

                        <!-- SECTION -->
                        <div class="sv-form-section-title mb-3">
                            <i class="bi bi-box"></i> Informations produit
                        </div>

                        <div class="sv-form-group">
                            <label>Désignation <span class="sv-required">*</span></label>
                            <input type="text"
                                   th:field="*{designation}"
                                   placeholder="Nom du produit/service"
                                   class="sv-input"
                                   required>
                        </div>

                        <div class="sv-form-group">
                            <label>Catégorie</label>
                            <input type="text"
                                   th:field="*{category}"
                                   placeholder="Ex: Conseil, Développement..."
                                   class="sv-input">
                        </div>

                        <div class="sv-form-group">
                            <label>Prix unitaire HT (€) <span class="sv-required">*</span></label>
                            <input type="number"
                                   th:field="*{unitPrice}"
                                   step="0.01"
                                   min="0"
                                   placeholder="0.00"
                                   class="sv-input"
                                   required>
                        </div>

                        <div class="sv-form-group">
                            <label>Description</label>
                            <textarea th:field="*{description}"
                                      placeholder="Description du produit ou service"
                                      class="sv-input"></textarea>
                        </div>

                        <div class="sv-form-actions mt-4">
                            <button type="submit" class="sv-btn sv-btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                            <a th:href="@{/admin/products}" class="sv-btn sv-btn-ghost">
                                Annuler
                            </a>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
