<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/sidebar :: head('Clients')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('customers')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/customers}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title"
                  th:text="${customer.id == null ? 'Nouveau client' : 'Modifier le client'}">
            </span>
        </div>
    </div>

    <div class="page-content">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="sv-form-card">

                    <div th:if="${error}" class="sv-alert sv-alert-error mb-4">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="${customer.id == null ? '/admin/customers/new' : '/admin/customers/edit/' + customer.id}"
                          th:object="${customer}"
                          method="post">

                        <!-- Infos client -->
                        <div class="sv-form-section-title mb-3">
                            <i class="bi bi-person"></i> Informations client
                        </div>

                        <div class="sv-form-group">
                            <label>Nom <span class="sv-required">*</span></label>
                            <input type="text" th:field="*{name}"
                                   placeholder="Nom du contact"
                                   class="sv-input" required>
                        </div>

                        <div class="sv-form-group">
                            <label>Raison sociale</label>
                            <input type="text" th:field="*{corporateName}"
                                   placeholder="Nom de l'entreprise"
                                   class="sv-input">
                        </div>

                        <div class="sv-form-group">
                            <label>Adresse</label>
                            <input type="text" th:field="*{address}"
                                   placeholder="Adresse"
                                   class="sv-input">
                        </div>

                        <div class="row g-3">
                            <div class="col-4">
                                <div class="sv-form-group">
                                    <label>Code postal</label>
                                    <input type="text" th:field="*{zipcode}"
                                           placeholder="75001"
                                           class="sv-input">
                                </div>
                            </div>
                            <div class="col-8">
                                <div class="sv-form-group">
                                    <label>Ville</label>
                                    <input type="text" th:field="*{city}"
                                           placeholder="Paris"
                                           class="sv-input">
                                </div>
                            </div>
                        </div>

                        <div class="sv-form-group">
                            <label>Délai de paiement (jours)</label>
                            <input type="number" th:field="*{delay}"
                                   min="0" placeholder="30"
                                   class="sv-input">
                        </div>

                        <!-- Compte utilisateur — création uniquement -->
                        <div th:if="${customer.id == null}">
                            <hr class="sv-divider">
                            <div class="sv-form-section-title mb-3">
                                <i class="bi bi-shield-lock"></i> Compte utilisateur
                            </div>

                            <div class="sv-form-group">
                                <label>Email <span class="sv-required">*</span></label>
                                <div class="sv-input-hint">Servira d'identifiant de connexion</div>
                                <input type="email" name="username"
                                       placeholder="client@entreprise.com"
                                       class="sv-input" required>
                            </div>

                            <div class="sv-form-group">
                                <label>Mot de passe <span class="sv-required">*</span></label>
                                <input type="password" name="password"
                                       placeholder="Mot de passe"
                                       class="sv-input" required>
                            </div>

                            <div class="sv-form-group">
                                <label>Rôle <span class="sv-required">*</span></label>
                                <select name="role" class="sv-select" required title="role">
                                    <option value="ROLE_CLIENT">
                                        Client — accès espace facturation
                                    </option>
                                    <option value="ROLE_ADMIN">
                                        Administrateur — accès back-office
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="sv-form-actions mt-4">
                            <button type="submit" class="sv-btn sv-btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                            <a th:href="@{/admin/customers}" class="sv-btn sv-btn-ghost">
                                Annuler
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
