<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/sidebar :: head('Clients')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar('customers')}"></div>

<div class="main-content" id="mainContent">
    <div class="topbar">
        <span class="topbar-title">Clients</span>
        <div class="topbar-actions">
            <a th:href="@{/admin/customers/new}" class="sv-btn sv-btn-primary">
                <i class="bi bi-plus-lg"></i> Nouveau client
            </a>
        </div>
    </div>

    <div class="page-content">
        <div class="sv-table-card">
            <table class="table sv-table mb-0">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Raison sociale</th>
                        <th>Ville</th>
                        <th>Délai</th>
                        <th>Email / Identifiant</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${customers}">
                        <td class="fw-500" th:text="${c.name}"></td>
                        <td class="text-muted" th:text="${c.corporateName}"></td>
                        <td class="text-muted" th:text="${c.city}"></td>
                        <td>
                            <span class="sv-badge sv-badge-created"
                                  th:text="${c.delay} + ' j'"></span>
                        </td>
                        <td class="text-muted"
                            th:text="${c.userAccount != null ? c.userAccount.username : '—'}"></td>
                        <td>
                            <div class="sv-actions">
                                <a th:href="@{/admin/customers/edit/{id}(id=${c.id})}"
                                   class="sv-btn-icon" title="Modifier">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/customers/delete/{id}(id=${c.id})}"
                                      method="post"
                                      onsubmit="return confirm('Supprimer ce client ?')">
                                    <button type="submit"
                                            class="sv-btn-icon sv-btn-icon-danger"
                                            title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="6" class="sv-empty">Aucun client enregistré.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
