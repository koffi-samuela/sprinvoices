<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - SprinVoices</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f5f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); padding: 40px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 26px; color: #C0392B; margin-bottom: 4px; }
        .logo p { color: #7f8c8d; font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #2c3e50; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: #C0392B; outline: none; box-shadow: 0 0 0 3px rgba(192,57,43,0.1); }
        button { width: 100%; padding: 12px; background: #C0392B; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #a93226; }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
        .alert-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
        .alert-error { background: #fdecea; color: #C0392B; border: 1px solid #f5c6cb; }
        .hint { font-size: 12px; color: #999; margin-top: 4px; }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-link a { color: #C0392B; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">

        <div class="logo">
            <h1>SprinVoices</h1>
            <p>Nouveau mot de passe</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Token invalide / expiré : pas de formulaire -->
        <div th:if="${error != null and token == null}">
            <div class="back-link" style="margin-top:0">
                <a th:href="@{/forgot-password}">← Demander un nouveau lien</a>
            </div>
        </div>

        <!-- Formulaire si token valide -->
        <div th:if="${token != null}">
            <form method="post" th:action="@{/reset-password}">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required autofocus/>
                    <p class="hint">Minimum 8 caractères</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="••••••••" required/>
                </div>

                <button type="submit">Enregistrer le nouveau mot de passe</button>
            </form>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">← Retour à la connexion</a>
        </div>
    </div>
</div>
</body>
</html>
