<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - SprinVoices</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="login-container">
    <div class="card">

        <div class="logo">
            <h1>SprinVoices</h1>
            <p>Nouveau mot de passe</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Token invalide / expiré : pas de formulaire -->
        <div th:if="${error != null and token == null}">
            <div class="back-link" style="margin-top:0">
                <a th:href="@{/forgot-password}">← Demander un nouveau lien</a>
            </div>
        </div>

        <!-- Formulaire si token valide -->
        <div th:if="${token != null}">
            <form method="post" th:action="@{/reset-password}">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required autofocus/>
                    <p class="hint">Minimum 8 caractères</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="••••••••" required/>
                </div>

                <button type="submit">Enregistrer le nouveau mot de passe</button>
            </form>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">← Retour à la connexion</a>
        </div>
    </div>
</div>
</body>
</html>
