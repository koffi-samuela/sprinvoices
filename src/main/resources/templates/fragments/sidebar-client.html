<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — SprinVoices'">SprinVoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
<aside th:fragment="sidebar(activePage)" id="sidebar" class="sidebar">

    <div class="sidebar-logo">
        <div class="logo-icon">SV</div>
        <span class="logo-text">SprinVoices</span>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-title">Mon espace</div>

        <a th:href="@{/client/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active'"
           class="nav-item">
            <i class="bi bi-file-earmark-text nav-icon"></i>
            <span class="nav-label">Mes factures</span>
        </a>
        <a th:href="@{/client/quotes}"
   th:classappend="${activePage == 'quotes'} ? ' active'"
   class="nav-item">
    <i class="bi bi-receipt nav-icon"></i>
    <span class="nav-label">Mes devis</span>
</a>

        <div class="nav-section-title">Compte</div>

<form th:action="@{/logout}" method="post" id="logoutForm" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
</form>

<a href="#" class="nav-item" onclick="document.getElementById('logoutForm').submit(); return false;">
    <i class="bi bi-box-arrow-right nav-icon"></i>
    <span class="nav-label">Déconnexion</span>
</a>
    </nav>

    <div class="sidebar-user">
        <div class="user-avatar">C</div>
        <div class="user-info">
            <div class="user-name" th:text="${#authentication.name}">Client</div>
            <div class="user-role">Client</div>
        </div>
    </div>

</aside>
