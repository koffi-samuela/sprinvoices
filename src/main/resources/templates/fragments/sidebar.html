<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — SprinVoices'">SprinVoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
<aside th:fragment="sidebar(activePage)" id="sidebar" class="sidebar">

    <div class="sidebar-logo">
        <div class="logo-icon">SV</div>
        <span class="logo-text">SprinVoices</span>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-title">Menu principal</div>

        <a th:href="@{/admin/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active'"
           class="nav-item">
            <i class="bi bi-speedometer2 nav-icon"></i>
            <span class="nav-label">Dashboard</span>
        </a>

        <a th:href="@{/admin/invoices}"
           th:classappend="${activePage == 'invoices'} ? ' active'"
           class="nav-item">
            <i class="bi bi-receipt nav-icon"></i>
            <span class="nav-label">Factures</span>
        </a>

        <a th:href="@{/admin/customers}"
           th:classappend="${activePage == 'customers'} ? ' active'"
           class="nav-item">
            <i class="bi bi-people nav-icon"></i>
            <span class="nav-label">Clients</span>
        </a>

        <a th:href="@{/admin/products}"
           th:classappend="${activePage == 'products'} ? ' active'"
           class="nav-item">
            <i class="bi bi-box-seam nav-icon"></i>
            <span class="nav-label">Produits</span>
        </a>

        <div class="nav-section-title">Compte</div>

        <a th:href="@{/logout}" class="nav-item">
            <i class="bi bi-box-arrow-right nav-icon"></i>
            <span class="nav-label">Déconnexion</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div class="user-info">
            <div class="user-name">Administrateur</div>
            <div class="user-role">Admin</div>
        </div>
    </div>

</aside>
