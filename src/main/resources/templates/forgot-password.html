<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié - SprinVoices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Reprend le même style que login.html -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f5f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); padding: 40px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 26px; color: #C0392B; margin-bottom: 4px; }
        .logo p { color: #7f8c8d; font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #2c3e50; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: #C0392B; outline: none; box-shadow: 0 0 0 3px rgba(192,57,43,0.1); }
        button { width: 100%; padding: 12px; background: #C0392B; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #a93226; }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
        .alert-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
        .alert-error { background: #fdecea; color: #C0392B; border: 1px solid #f5c6cb; }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-link a { color: #C0392B; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">

        <div class="logo">
            <h1>SprinVoices</h1>
            <p>Réinitialisation du mot de passe</p>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <!-- On cache le formulaire après envoi -->
        <div th:if="${message == null}">
            <p style="color:#555;font-size:14px;margin-bottom:20px;">
                Saisissez votre adresse email. Si elle est associée à un compte,
                vous recevrez un lien de réinitialisation.
            </p>

            <form method="post" th:action="@{/forgot-password}">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email"
                           placeholder="ex: admin@company.com" required autofocus/>
                </div>
                <button type="submit">Envoyer le lien</button>
            </form>
        </div>

        <div class="back-link">
            <a th:href="@{/login}">← Retour à la connexion</a>
        </div>
    </div>
</div>
</body>
</html>
