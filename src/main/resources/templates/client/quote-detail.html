<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar-client :: head('Devis')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar-client :: sidebar('quotes')}"></div>

<div class="main-content" id="mainContent">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/client/quotes}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title" th:text="${quote.number}"></span>
        </div>
    </div>

    <div class="page-content">

        <!-- HEADER CARD -->
        <div class="sv-form-card mb-4">

            <div class="d-flex justify-content-between align-items-start mb-4">

                <!-- LEFT -->
                <div>
                    <div class="sv-form-section-title mb-1">
                        <i class="bi bi-file-earmark-text"></i>
                        Devis
                    </div>
                    <div class="text-muted" th:text="${quote.designation}"></div>
                </div>

                <!-- RIGHT -->
                <div class="text-end">

                    <div class="fw-500" style="font-size:18px; color:#8e44ad;"
                         th:text="'DEVIS ' + ${quote.number}">
                    </div>

                    <div class="mt-2">

                        <span th:if="${quote.status == 'DRAFT'}"
                              class="sv-badge sv-badge-created">Brouillon</span>

                        <span th:if="${quote.status == 'SENT'}"
                              class="sv-badge sv-badge-invoiced">En attente</span>

                        <span th:if="${quote.status == 'ACCEPTED'}"
                              class="sv-badge sv-badge-paid">Accepté</span>

                        <span th:if="${quote.status == 'REFUSED'}"
                              class="sv-badge sv-badge-danger">Refusé</span>

                    </div>

                </div>

            </div>

            <!-- INFOS -->
            <div class="row g-3">

                <!-- CLIENT -->
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Destinataire</div>

                        <div class="fw-500" th:text="${quote.customer.name}"></div>
                        <div class="text-muted" th:text="${quote.customer.corporateName}"></div>
                        <div class="text-muted" th:text="${quote.customer.address}"></div>
                        <div class="text-muted"
                             th:text="${quote.customer.zipcode} + ' ' + ${quote.customer.city}"></div>
                    </div>
                </div>

                <!-- DATES -->
                <div class="col-md-6">
                    <div class="sv-info-box">

                        <div class="sv-info-label">Informations</div>

                        <div>
                            Créé le :
                            <span th:text="${#temporals.format(quote.createdAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${quote.sentAt != null}">
                            Envoyé le :
                            <span th:text="${#temporals.format(quote.sentAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${quote.sentAt == null}" class="text-muted">
                            Non encore envoyé
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="sv-table-card">

            <table class="table sv-table mb-0">

                <thead>
                    <tr>
                        <th>Désignation</th>
                        <th>Catégorie</th>
                        <th>Prix HT</th>
                        <th>Qté</th>
                        <th>Montant</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="row : ${quote.rows}">
                        <td class="fw-500" th:text="${row.product.designation}"></td>

                        <td>
                            <span class="sv-badge sv-badge-created"
                                  th:text="${row.product.category}"></span>
                        </td>

                        <td th:text="${#numbers.formatDecimal(row.product.unitPrice,1,2)} + ' €'"></td>

                        <td th:text="${row.quantity}"></td>

                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(row.amount(),1,2)} + ' €'"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(quote.rows)}">
                        <td colspan="5" class="sv-empty">
                            Aucun produit dans ce devis.
                        </td>
                    </tr>

                    <!-- TOTAL -->
                    <tr>
                        <td colspan="4" class="text-end fw-500">TOTAL HT</td>
                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(quote.total(),1,2)} + ' €'"></td>
                    </tr>

                </tbody>

            </table>

        </div>

        <!-- ACTIONS CLIENT -->
        <div class="sv-form-actions mt-4">

            <form th:if="${quote.status == 'SENT'}"
                  th:action="@{/client/quotes/{id}/accept(id=${quote.id})}"
                  method="post">

                <button class="sv-btn sv-btn-primary"
                        onclick="return confirm('Accepter ce devis ?')">
                    <i class="bi bi-check-lg"></i> Accepter
                </button>

            </form>

            <form th:if="${quote.status == 'SENT'}"
                  th:action="@{/client/quotes/{id}/refuse(id=${quote.id})}"
                  method="post">

                <button class="sv-btn sv-btn-danger"
                        onclick="return confirm('Refuser ce devis ?')">
                    <i class="bi bi-x-lg"></i> Refuser
                </button>

            </form>

        </div>

        <!-- STATUS MESSAGES -->
        <div class="mt-4">

            <div th:if="${quote.status == 'ACCEPTED'}"
                 class="sv-alert sv-alert-success">
                Vous avez accepté ce devis. Une facture sera générée automatiquement.
            </div>

            <div th:if="${quote.status == 'REFUSED'}"
                 class="sv-alert sv-alert-error">
                Vous avez refusé ce devis.
            </div>

        </div>

    </div>
</div>

</body>
</html>
