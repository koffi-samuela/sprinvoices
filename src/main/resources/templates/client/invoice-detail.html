<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar-client :: head('Facture')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar-client :: sidebar('dashboard')}"></div>

<div class="main-content" id="mainContent">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/client/dashboard}" class="sv-back-btn">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="topbar-title"
                  th:text="'Facture ' + ${invoice.number}">
            </span>
        </div>
    </div>

    <div class="page-content">

        <!-- HEADER -->
        <div class="sv-form-card mb-4">

            <div class="d-flex justify-content-between align-items-start mb-4">

                <!-- LOGO / TITLE -->
                <div>
                    <div class="sv-form-section-title mb-1">
                        <i class="bi bi-receipt"></i>
                        SprinVoices
                    </div>
                    <div class="text-muted">Module de facturation</div>
                </div>

                <!-- FACTURE INFO -->
                <div class="text-end">
                    <div class="fw-500" style="font-size:18px;">
                        FACTURE <span th:text="${invoice.number}"></span>
                    </div>

                    <div class="text-muted"
                         th:text="${invoice.designation}"></div>

                    <div class="mt-2">

                        <span th:if="${invoice.paidAt != null}"
                              class="sv-badge sv-badge-paid">Payée</span>

                        <span th:if="${invoice.paidAt == null and invoice.invoicedAt != null}"
                              class="sv-badge sv-badge-invoiced">Facturée</span>

                        <span th:if="${invoice.invoicedAt == null}"
                              class="sv-badge sv-badge-created">Créée</span>

                    </div>
                </div>

            </div>

            <!-- INFOS -->
            <div class="row g-3">

                <!-- CLIENT -->
                <div class="col-md-6">
                    <div class="sv-info-box">
                        <div class="sv-info-label">Facturer à</div>

                        <div class="fw-500" th:text="${invoice.customer.name}"></div>
                        <div class="text-muted" th:text="${invoice.customer.corporateName}"></div>
                        <div class="text-muted" th:text="${invoice.customer.address}"></div>
                        <div class="text-muted"
                             th:text="${invoice.customer.zipcode} + ' ' + ${invoice.customer.city}"></div>
                    </div>
                </div>

                <!-- DATES -->
                <div class="col-md-6">
                    <div class="sv-info-box">

                        <div class="sv-info-label">Informations</div>

                        <div>
                            Créée le :
                            <span th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${invoice.invoicedAt != null}">
                            Facturée le :
                            <span th:text="${#temporals.format(invoice.invoicedAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div th:if="${invoice.paidAt != null}">
                            Payée le :
                            <span th:text="${#temporals.format(invoice.paidAt, 'dd/MM/yyyy')}"></span>
                        </div>

                        <div class="text-muted mt-2">
                            Délai : <span th:text="${invoice.customer.delay}"></span> jours
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="sv-table-card">

            <table class="table sv-table mb-0">
                <thead>
                    <tr>
                        <th>Désignation</th>
                        <th>Catégorie</th>
                        <th>Prix HT</th>
                        <th>Qté</th>
                        <th>Montant</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="row : ${invoice.rows}">
                        <td class="fw-500" th:text="${row.product.designation}"></td>

                        <td>
                            <span class="sv-badge sv-badge-created"
                                  th:text="${row.product.category}"></span>
                        </td>

                        <td th:text="${#numbers.formatDecimal(row.product.unitPrice,1,2)} + ' €'"></td>

                        <td th:text="${row.quantity}"></td>

                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(row.amount(),1,2)} + ' €'"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(invoice.rows)}">
                        <td colspan="5" class="sv-empty">
                            Aucune ligne sur cette facture.
                        </td>
                    </tr>

                    <!-- TOTAL -->
                    <tr>
                        <td colspan="4" class="text-end fw-500">TOTAL HT</td>
                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(invoice.total(),1,2)} + ' €'"></td>
                    </tr>

                </tbody>
            </table>

        </div>

        <!-- ACTIONS -->
        <div class="sv-form-actions mt-4">

            <a th:href="@{/client/invoices/{id}/pdf(id=${invoice.id})}"
               target="_blank"
               class="sv-btn sv-btn-secondary">
                <i class="bi bi-eye"></i> Voir PDF
            </a>

            <a th:href="@{/client/invoices/{id}/pdf/download(id=${invoice.id})}"
               class="sv-btn sv-btn-primary">
                <i class="bi bi-download"></i> Télécharger
            </a>

        </div>

    </div>
</div>

</body>
</html>
