<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/sidebar-client :: head('Mes devis')}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar-client :: sidebar('quotes')}"></div>

<div class="main-content" id="mainContent">

    <!-- TOPBAR -->
    <div class="topbar">
        <span class="topbar-title">Mes devis</span>
    </div>

    <div class="page-content">

        <!-- TABLE -->
        <div class="sv-table-card">

            <table class="table sv-table mb-0">

                <thead>
                    <tr>
                        <th>Numéro</th>
                        <th>Désignation</th>
                        <th>Date</th>
                        <th>État</th>
                        <th>Total HT</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="q : ${quotes}">

                        <!-- NUMBER -->
                        <td class="fw-500" style="color:#8e44ad;" th:text="${q.number}"></td>

                        <!-- DESIGNATION -->
                        <td th:text="${q.designation}"></td>

                        <!-- DATE -->
                        <td class="text-muted"
                            th:text="${#temporals.format(q.createdAt, 'dd/MM/yyyy à HH:mm')}"></td>

                        <!-- STATUS -->
                        <td>

                            <span th:if="${q.status == 'DRAFT'}"
                                  class="sv-badge sv-badge-created">
                                Brouillon
                            </span>

                            <span th:if="${q.status == 'SENT'}"
                                  class="sv-badge sv-badge-invoiced">
                                En attente
                            </span>

                            <span th:if="${q.status == 'ACCEPTED'}"
                                  class="sv-badge sv-badge-paid">
                                Accepté
                            </span>

                            <span th:if="${q.status == 'REFUSED'}"
                                  class="sv-badge sv-badge-danger">
                                Refusé
                            </span>

                        </td>

                        <!-- TOTAL -->
                        <td class="fw-500"
                            th:text="${#numbers.formatDecimal(q.total(), 1, 2)} + ' €'">
                        </td>

                        <!-- ACTION -->
                        <td>
                            <a th:href="@{/client/quotes/{id}(id=${q.id})}"
                               class="sv-btn sv-btn-secondary sv-btn-sm">
                                Voir
                            </a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(quotes)}">
                        <td colspan="6" class="sv-empty">
                            Aucun devis pour le moment.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
